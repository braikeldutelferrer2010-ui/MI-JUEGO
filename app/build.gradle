plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {compileOptions {android {
    namespace 'com.example.mi_juego'
    compileSdk 35
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

kotlinOptions {
    jvmTarget = '17'
}
    

    defaultConfig {
        applicationId 'com.mijuego.futbol'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
