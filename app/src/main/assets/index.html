<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071b13"><title>MI JUEGO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b13;color:white;font-family:system-ui,Arial;touch-action:none}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:env(safe-area-inset-top,8px);left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:#06140fce;border:1px solid #ffffff25;border-radius:14px;padding:7px 14px;font-weight:800;letter-spacing:.5px;white-space:nowrap}.top small{font-size:10px;color:#b8d6c6;display:block;text-align:center}.score{font-size:21px}.team{font-size:11px;color:#d7f5e4}.hint{position:absolute;top:66px;left:50%;transform:translateX(-50%);font-size:11px;color:#d6f3df;background:#00150db0;padding:5px 10px;border-radius:10px;white-space:nowrap}.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 20px}.stick{width:126px;height:126px;border-radius:50%;background:#d8f5e51b;border:2px solid #ffffff55;position:relative;pointer-events:auto;touch-action:none}.knob{width:48px;height:48px;position:absolute;left:37px;top:37px;border-radius:50%;background:#e9fff0a8;border:2px solid white;box-shadow:0 3px 12px #0008}.actions{display:grid;grid-template-columns:repeat(2,68px);gap:9px;pointer-events:auto}.btn{height:62px;border-radius:50%;border:2px solid #ffffffaa;background:#082e20d9;color:white;font-weight:900;font-size:11px;box-shadow:0 4px 12px #0007;touch-action:none}.btn:active{background:#159454}.btn.big{background:#087c42e8;width:74px;height:74px}.btn small{display:block;font-size:9px;font-weight:500}.center{position:absolute;inset:0;display:grid;place-items:center;background:#00150dbb;pointer-events:auto}.panel{background:linear-gradient(145deg,#123d2a,#061a12);border:1px solid #ffffff35;border-radius:22px;padding:26px 24px;text-align:center;width:min(88vw,360px);box-shadow:0 18px 55px #0009}.panel h1{font-size:32px;margin:0;color:#8df0ad;letter-spacing:2px}.panel p{font-size:13px;color:#d2e9da;line-height:1.5}.start{background:#16a45a;border:0;color:white;border-radius:12px;padding:14px 24px;font-weight:900;font-size:16px;width:100%;margin-top:8px}.tag{font-size:10px;color:#9fcbb0;letter-spacing:1px}.hidden{display:none!important}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div><small>LOCAL</small><span class="team">VERDES</span></div><span class="score" id="score">0 - 0</span><div><small>AMISTOSO</small><span class="team">ROJOS</span></div><span id="clock" style="font-size:13px;color:#bde7cb">00:00</span></div><div class="hint" id="hint">Mueve el joystick · Acércate al balón</div><div class="controls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn" id="pass">PASE<small>corto</small></button><button class="btn big" id="shoot">TIRO<small>disparar</small></button><button class="btn" id="switch">CAMBIAR<small>jugador</small></button><button class="btn" id="sprint">SPRINT<small>correr</small></button></div></div></div>
<div class="center" id="menu"><div class="panel"><div class="tag">FÚTBOL 3D · MODO SIN INTERNET</div><h1>MI JUEGO</h1><p>Partido de prueba · Verdes contra Rojos<br>Controla al jugador, roba el balón y marca goles.<br><b>Optimizado para pantallas de teléfono.</b></p><button class="start" id="play">JUGAR PARTIDO</button><p class="tag">PROTOTIPO JUGABLE · VERSIÓN 0.1</p></div></div>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,1.6);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const state={live:false,t:0,goals:[0,0],dir:{x:0,y:0},sprint:false,active:0,ball:{x:0,y:0,vx:0,vy:0,owner:0},players:[],last:0};
function reset(){state.t=0;state.goals=[0,0];state.players=[];for(let team=0;team<2;team++)for(let i=0;i<5;i++){state.players.push({team,i,x:(team?0.68:0.32)+(i%2)*.045,y:.23+Math.floor(i/2)*.18+(team?-.02:.02),vx:0,vy:0})}state.ball={x:.5,y:.5,vx:0,vy:0,owner:0};state.active=0;}
reset();function pos(p){let perspective=.68+p.y*.38;return{x:W*(.12+p.x*.76),y:H*(.18+p.y*.67),s:perspective}}
function field(){let top=H*.15,bottom=H*.91,l=W*.07,r=W*.93;ctx.fillStyle='#10251b';ctx.fillRect(0,0,W,H);let g=ctx.createLinearGradient(0,top,0,bottom);g.addColorStop(0,'#27844d');g.addColorStop(1,'#0e6036');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(W*.20,top);ctx.lineTo(W*.80,top);ctx.lineTo(r,bottom);ctx.lineTo(l,bottom);ctx.closePath();ctx.fill();ctx.save();ctx.beginPath();ctx.moveTo(W*.20,top);ctx.lineTo(W*.80,top);ctx.lineTo(r,bottom);ctx.lineTo(l,bottom);ctx.closePath();ctx.clip();for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#ffffff08':'#001b0d0a';ctx.fillRect(l+i*(r-l)/8,top,(r-l)/8,bottom-top)}ctx.strokeStyle='#e9fff0c9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.2,top);ctx.lineTo(W*.8,top);ctx.lineTo(r,bottom);ctx.lineTo(l,bottom);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(W*.14,H*.53);ctx.lineTo(W*.86,H*.53);ctx.stroke();ctx.beginPath();ctx.ellipse(W*.5,H*.53,W*.115,H*.095,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#e8fff0';ctx.beginPath();ctx.arc(W*.5,H*.53,3,0,7);ctx.fill();ctx.strokeRect(W*.36,H*.15,W*.28,H*.14);ctx.strokeRect(W*.36,H*.77,W*.28,H*.14);ctx.strokeRect(W*.43,H*.15,W*.14,H*.055);ctx.strokeRect(W*.43,H*.855,W*.14,H*.055);ctx.restore();ctx.fillStyle='#ddd';ctx.fillRect(W*.43,H*.125,W*.14,5);ctx.fillRect(W*.43,H*.91,W*.14,5);}
function drawPlayer(p){let q=pos(p),s=q.s;ctx.save();ctx.translate(q.x,q.y);ctx.fillStyle='#00150b66';ctx.beginPath();ctx.ellipse(0,8*s,13*s,5*s,0,0,7);ctx.fill();ctx.fillStyle=p.team?'#d83c39':'#18d477';ctx.beginPath();ctx.ellipse(0,0,10*s,13*s,0,0,7);ctx.fill();ctx.fillStyle=p.team?'#a91f25':'#087c45';ctx.fillRect(-7*s,-2*s,14*s,7*s);ctx.fillStyle='#f2c7a2';ctx.beginPath();ctx.arc(0,-13*s,6*s,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font=`bold ${8*s}px Arial`;ctx.textAlign='center';ctx.fillText(p.i+1,0,3*s);if(!p.team&&p.i===state.active){ctx.strokeStyle='#fff58a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,17*s,0,7);ctx.stroke();ctx.fillStyle='#fff58a';ctx.beginPath();ctx.moveTo(0,-27*s);ctx.lineTo(-5*s,-34*s);ctx.lineTo(5*s,-34*s);ctx.fill()}ctx.restore()}
function drawBall(){let b=state.ball,q=pos(b);ctx.fillStyle='#00150b66';ctx.beginPath();ctx.ellipse(q.x,q.y+5*q.s,6*q.s,3*q.s,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x,q.y,5*q.s,0,7);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.stroke();}
function nearest(team,x,y){let best=null,dist=9;state.players.forEach(p=>{if(p.team===team){let d=Math.hypot(p.x-x,p.y-y);if(d<dist){best=p;dist=d}}});return best}
function update(dt){if(!state.live)return;state.t+=dt;let p=state.players.find(p=>!p.team&&p.i===state.active),b=state.ball;let speed=state.sprint?.55:.36;if(p){p.vx=state.dir.x*speed;p.vy=state.dir.y*speed;p.x=Math.max(.08,Math.min(.92,p.x+p.vx*dt));p.y=Math.max(.08,Math.min(.92,p.y+p.vy*dt));if(b.owner===0){b.x=p.x+(state.dir.x*.028);b.y=p.y+.018+state.dir.y*.02}else if(Math.hypot(p.x-b.x,p.y-b.y)<.045&&b.owner!==1){b.owner=0;b.x=p.x;b.y=p.y+.02}}
state.players.filter(x=>x.team===1).forEach(e=>{let target=b.owner===1?p:b;let dx=target.x-e.x,dy=target.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*.19*dt;e.y+=dy/d*.19*dt;if(d<.04&&b.owner===0&&Math.random()<.006){b.owner=1;b.x=e.x;b.y=e.y}});
state.players.filter(x=>x.team===0&&x.i!==state.active).forEach(a=>{let dx=.48-a.x,dy=.5-a.y,d=Math.hypot(dx,dy)||1;a.x+=dx/d*.055*dt;a.y+=dy/d*.055*dt});
if(b.owner===1){let enemy=nearest(1,b.x,b.y);if(enemy){b.x=enemy.x;b.y=enemy.y+.02;if(Math.random()<.003){b.owner=0}}}b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.32,dt);b.vy*=Math.pow(.32,dt);if(b.owner===3&&Math.hypot(b.vx,b.vy)<.055){b.owner=0;b.vx=0;b.vy=0}if(b.y<.12||b.y>.91){if(b.x>.43&&b.x<.57){if(b.y<.12)state.goals[0]++;else state.goals[1]++;document.getElementById('score').textContent=state.goals[0]+' - '+state.goals[1];resetPositions()}else{b.y=Math.max(.12,Math.min(.91,b.y));b.vy*=-.45}}b.x=Math.max(.08,Math.min(.92,b.x));document.getElementById('clock').textContent=String(Math.floor(state.t/60)).padStart(2,'0')+':'+String(Math.floor(state.t%60)).padStart(2,'0');}
function resetPositions(){state.players.forEach(p=>{p.x=(p.team?.68:.32)+(p.i%2)*.045;p.y=.23+Math.floor(p.i/2)*.18});state.ball={x:.5,y:.5,vx:0,vy:0,owner:0};state.active=0}
function render(){ctx.clearRect(0,0,W,H);field();state.players.slice().sort((a,b)=>a.y-b.y).forEach(drawPlayer);drawBall();if(state.live){let p=state.players.find(p=>!p.team&&p.i===state.active);let q=pos(p);ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(state.ball.owner===0?'¡CON BALÓN!':'RECUPERA EL BALÓN',q.x,H*.115)}}
let last=performance.now();function loop(now){let dt=Math.min((now-last)/1000,.04);last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function kick(power){
  const p=state.players.find(p=>!p.team&&p.i===state.active), b=state.ball;
  if(!p) return;
  // El balón sale desde el jugador hacia la portería rival.
  const dx=.5-p.x, dy=.105-p.y, len=Math.hypot(dx,dy)||1;
  b.x=p.x; b.y=p.y+.012; b.owner=3;
  b.vx=(dx/len)*power*1.65 + state.dir.x*.22;
  b.vy=(dy/len)*power*1.65 + state.dir.y*.12;
  const hint=document.getElementById('hint');
  hint.textContent='¡DISPARO! ⚽';
  clearTimeout(window.__shotHint);
  window.__shotHint=setTimeout(()=>{hint.textContent='Mueve el joystick · Acércate al balón'},900);
}

function bind(id,fn){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    fn();
  });
}

bind('shoot',()=>kick(.75));
bind('pass',()=>kick(.35));

bind('switch',()=>{
  state.active=(state.active+1)%5;
});

document.getElementById('sprint').addEventListener('pointerdown',()=>{
  state.sprint=true;
});
document.getElementById('sprint').addEventListener('pointerup',()=>{
  state.sprint=false;
});
document.getElementById('sprint').addEventListener('pointercancel',()=>{
  state.sprint=false;
});

const stick=document.getElementById('stick');
const knob=document.getElementById('knob');

stick.addEventListener('pointerdown',e=>{
  stick.setPointerCapture(e.pointerId);
  moveStick(e);
});
stick.addEventListener('pointermove',e=>{
  if(e.buttons)moveStick(e);
});
function moveStick(e){
  const r=stick.getBoundingClientRect();
  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);
  const max=39;
  const d=Math.hypot(x,y)||1;
  if(d>max){x=x/d*max;y=y/d*max;}
  knob.style.transform=`translate(${x}px,${y}px)`;
  state.dir.x=x/max;
  state.dir.y=y/max;
}
function stopStick(){
  state.dir.x=0;
  state.dir.y=0;
  knob.style.transform='translate(0,0)';
}
stick.addEventListener('pointerup',stopStick);
stick.addEventListener('pointercancel',stopStick);

document.getElementById('play').addEventListener('click',()=>{
  document.getElementById('menu').classList.add('hidden');
  state.live=true;
});

})();
</script>
</body>
</html>
